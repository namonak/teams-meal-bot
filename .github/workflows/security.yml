name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 18 * * *' # 매일 03:00 KST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag teams-meal-bot:${{ github.sha }} .
      - name: Scan Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: teams-meal-bot:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          version: v0.76.2
